<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Avisos</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
    }

    header {
        background: #ffffff;
        padding: 24px 20px;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    header h1 {
        margin: 0;
    }

    main {
        max-width: 800px;
        margin: 30px auto;
        padding: 0 20px;
    }

    #msg {
        margin-bottom: 20px;
    }

    #posts {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    article {
        background: #ffffff;
        padding: 20px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    article h2 {
        margin-top: 0;
    }

    article p {
        line-height: 1.6;
    }

    article small {
        color: #666;
    }
</style>

</head><body><header>
    <h1>Avisos</h1>
</header>

<main>

    <div id="msg"></div>

    <section id="posts"></section>

</main>

<script src="app.js"></script>

</body>
</html>
